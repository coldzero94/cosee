name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: make test
      - name: Lint
        run: make lint
      - name: Build installation packages
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: Cosee-local-development
          path: artifacts/development/
